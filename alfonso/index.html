    <script>
        // Si abren /nombre sin la barra final, redirige a /nombre/ para que datos.js y estilos se encuentren
        if (!/\/$/.test(location.pathname) && !/\.html?$/.test(location.pathname)) {
            location.replace(location.pathname + '/' + location.search + location.hash);
        }
    </script>
</head>
<body>
    <div class="card-container" id="tarjeta"></div>

    <script>
        // Si datos.js tiene un error de escritura, la página muestra dónde está
        window.addEventListener('error', function (e) {
            if (/datos\.js/.test(e.filename || '')) window.__errDatos = e.message + ' (línea ' + e.lineno + ')';
        });
    </script>
    <script src="datos.js"></script>
    <script src="../assets/card.js"></script>
</body>
</html>
